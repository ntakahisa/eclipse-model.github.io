<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>日食と2つの公転面</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#edf2ff;font-family:system-ui,"Yu Gothic",sans-serif;touch-action:manipulation}
header{padding:12px 16px 6px}
h1{font-size:19px;margin:0}
header p{font-size:11px;color:#9baac6;margin:4px 0}
main{max-width:1100px;margin:auto;padding:6px 10px 20px}
.scene{height:min(58vh,550px);min-height:300px;position:relative;border:1px solid #293750;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at center,#17223a,#080d19 75%)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;top:10px;left:12px;color:#a8b6d0;font-size:11px;pointer-events:none;background:rgba(8,13,25,0.6);padding:3px 6px;border-radius:4px}
.status{display:flex;gap:9px;align-items:center;min-height:42px;font-size:12px;margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%;background:#7787a6;flex-shrink:0}
.dot.on{background:#ffcf69;box-shadow:0 0 14px #ffcf69}
.panel{background:#111b2d;border:1px solid #293850;border-radius:12px;padding:12px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.controls-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:13px;font-weight:600}
input[type=range]{width:100%;margin:12px 0 5px;accent-color:#ffce69}
button{background:#253650;border:1px solid #465875;color:#edf2ff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
button.active{background:#415d88;border-color:#6c8bbd;box-shadow:0 0 8px rgba(108,139,189,0.5)}
select{background:#253650;border:1px solid #465875;color:#edf2ff;padding:6px 8px;border-radius:8px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;color:#c2cee4;font-size:11px}
.key{display:flex;align-items:center;gap:6px}
.swatch{width:10px;height:10px;border-radius:50%}
.ends{display:flex;justify-content:space-between;font-size:11px;color:#8e9fbb}
.note{font-size:11px;line-height:1.6;color:#9baac6;padding:8px 2px}
@media(max-width:520px){h1{font-size:16px}.scene{height:50vh;min-height:280px}.panel{padding:10px}}
</style>
</head>
<body>
<header>
  <h1>日食と公転面の3Dモデル</h1>
  <p>軌道半径：太陽70・月65 ／ 公転面の傾き5.1° ／ 交点付近±16.8°で日食シーズン</p>
</header>
<main>
  <div class="scene">
    <canvas id="view"></canvas>
    <div class="hint">1本指スライド：視点回転 ／ ピンチ：拡大・縮小</div>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status">スライダーを動かして、2つの公転面と天体の位置関係を観察しよう。</span>
  </div>
  <section class="panel">
    <div class="row">
      <label for="time">時間を動かす</label>
      <div class="controls-group">
        <button id="playBtn">▶ 自動再生</button>
        <select id="speedSelect">
          <option value="1">1倍速</option>
          <option value="5" selected>5倍速</option>
          <option value="20">20倍速</option>
          <option value="50">50倍速</option>
        </select>
        <button id="reset">初期位置に戻す</button>
      </div>
    </div>
    <input id="time" type="range" min="0" max="6798.383" step="0.1" value="0">
    <div class="ends"><span>開始</span><span>時間の経過 →</span><span>約6798.383日</span></div>
    <div class="legend">
      <span class="key"><i class="swatch" style="background:#ffd16b"></i>太陽</span>
      <span class="key"><i class="swatch" style="background:#65a5ff"></i>地球</span>
      <span class="key"><i class="swatch" style="background:#d2d9e8"></i>月</span>
      <span class="key"><i class="swatch" style="background:#54d9cc"></i>太陽の見かけの公転面</span>
      <span class="key"><i class="swatch" style="background:#8c9cff"></i>月の公転面</span>
      <span class="key"><i class="swatch" style="background:#f0b1ff"></i>交点</span>
      <span class="key"><i class="swatch" style="background:#ff8c73"></i>日食が起こり得る範囲（±16.8°）</span>
    </div>
  </section>
  <div class="note">
    太陽の見かけの公転周期：365.2422日 ／ 月の公転周期：27.3217日<br>
    月の公転面は黄道面に対して3D座標上で5.1°傾いています。交点の前後±16.8°以内に入り、さらに月が新月方向に整列したときだけ強調します。
  </div>
</main>
<script>
(() => {
"use strict";

const canvas=document.getElementById("view");
const ctx=canvas.getContext("2d");
const slider=document.getElementById("time");
const status=document.getElementById("status");
const dot=document.getElementById("dot");
const playBtn=document.getElementById("playBtn");
const speedSelect=document.getElementById("speedSelect");

const YEAR=365.2422;          
const MONTH=27.3217;          
const NODE_PERIOD=6798.383;   
const INC=5.1*Math.PI/180;
const ECLIPSE_LIMIT=16.8*Math.PI/180;
const ALIGN_LIMIT=0.018; 
const TAU=2*Math.PI;

const SUN_ORBIT=70;
const MOON_ORBIT=65;
const SUN_SIZE=4.0;
const EARTH_SIZE=2.7;
const MOON_SIZE=2.0;

let day=0;
let yaw=-0.55;
let pitch=0.30;
let zoom=1.0;
let W=0,H=0,DPR=1;
let current;

// 自動再生用の変数
let isPlaying=false;
let lastTimestamp=null;
let animationFrameId=null;

const V={
 add:(a,b)=>a.map((v,i)=>v+b[i]),
 sub:(a,b)=>a.map((v,i)=>v-b[i]),
 mul:(a,s)=>a.map(v=>v*s),
 dot:(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),
 cross:(a,b)=>[
  a[1]*b[2]-a[2]*b[1],
  a[2]*b[0]-a[0]*b[2],
  a[0]*b[1]-a[1]*b[0]
 ],
 len:a=>Math.hypot(...a),
 unit(a){return this.mul(a,1/(this.len(a)||1))}
};

function camera(v){
 const cy=Math.cos(yaw),sy=Math.sin(yaw);
 const cp=Math.cos(pitch),sp=Math.sin(pitch);
 const x=cy*v[0]+sy*v[2];
 const z=-sy*v[0]+cy*v[2];
 return [x,cp*v[1]-sp*z,sp*v[1]+cp*z];
}
function project(v){
 const q=camera(v);
 const scale=Math.min(W,H)*0.00415*zoom;
 return {
  x:W/2+q[0]*scale,
  y:H/2-q[1]*scale,
  depth:q[2],
  scale
 };
}

function geometry(t){
 const sunAngle=TAU*t/YEAR;
 const nodeAngle=-TAU*t/NODE_PERIOD;
 const moonAngle=TAU*t/MONTH-nodeAngle;

 const n=[Math.cos(nodeAngle),0,Math.sin(nodeAngle)];
 const q=[
  -Math.sin(nodeAngle)*Math.cos(INC),
  Math.sin(INC),
  Math.cos(nodeAngle)*Math.cos(INC)
 ];

 const sunDir=[Math.cos(sunAngle),0,Math.sin(sunAngle)];
 const moonDir=V.add(
  V.mul(n,Math.cos(moonAngle)),
  V.mul(q,Math.sin(moonAngle))
 );

 const sun=V.mul(sunDir,SUN_ORBIT);
 const earth=[0,0,0];
 const moon=V.mul(moonDir,MOON_ORBIT);

 const alignment=V.dot(sunDir,moonDir);
 const separation=Math.acos(Math.max(-1,Math.min(1,alignment)));
 const distanceFromAxis=V.len(V.cross(sunDir,moon));

 const nodeSeparation=Math.acos(Math.max(-1,Math.min(1,
  Math.abs(Math.cos(sunAngle-nodeAngle)))));
 const inEclipseSeason=nodeSeparation<=ECLIPSE_LIMIT;
 const eclipse=inEclipseSeason && alignment>0 && separation<ALIGN_LIMIT;

 return {sun,earth,moon,n,q,sunDir,moonDir,alignment,
  sunAngle,moonAngle,nodeAngle,separation,nodeSeparation,
  distanceFromAxis,inEclipseSeason,eclipse};
}

function drawPlane(g,kind){
 const N=240;
 const points=[];
 for(let i=0;i<=N;i++){
  const a=TAU*i/N;
  let p;
  if(kind==="sun"){
   p=[SUN_ORBIT*Math.cos(a),0,SUN_ORBIT*Math.sin(a)];
  }else{
   p=V.add(
    V.mul(g.n,MOON_ORBIT*Math.cos(a)),
    V.mul(g.q,MOON_ORBIT*Math.sin(a))
   );
  }
  points.push(project(p));
 }

 ctx.save();
 ctx.beginPath();
 ctx.moveTo(points[0].x,points[0].y);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
 ctx.closePath();

 ctx.fillStyle=kind==="sun"
  ?"rgba(54,210,194,0.075)"
  :"rgba(112,132,255,0.15)";
 ctx.fill();

 ctx.strokeStyle=kind==="sun"
  ?"rgba(84,230,211,0.8)"
  :"rgba(144,158,255,0.95)";
 ctx.lineWidth=kind==="sun"?1.5:2;
 ctx.setLineDash(kind==="sun"?[]:[5,4]);
 ctx.stroke();
 ctx.restore();
}

function drawEclipseWindows(g){
 const centers=[g.nodeAngle,g.nodeAngle+Math.PI];
 const center=centers.reduce((best,a)=>{
  const d=Math.abs(Math.atan2(Math.sin(g.sunAngle-a),Math.cos(g.sunAngle-a)));
  const bd=Math.abs(Math.atan2(Math.sin(g.sunAngle-best),Math.cos(g.sunAngle-best)));
  return d<bd?a:best;
 },centers[0]);
 ctx.save();
 ctx.fillStyle=g.inEclipseSeason ? "rgba(255,112,91,0.22)" : "rgba(255,140,115,0.10)";
 ctx.strokeStyle=g.inEclipseSeason ? "rgba(255,140,115,0.98)" : "rgba(255,140,115,0.42)";
 ctx.lineWidth=g.inEclipseSeason ? 2 : 1;
 const pts=[project([0,0,0])];
 const steps=44;
 for(let i=0;i<=steps;i++){
  const a=center-ECLIPSE_LIMIT+2*ECLIPSE_LIMIT*i/steps;
  pts.push(project([SUN_ORBIT*Math.cos(a),0,SUN_ORBIT*Math.sin(a)]));
 }
 ctx.beginPath();
 ctx.moveTo(pts[0].x,pts[0].y);
 for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();
 ctx.restore();
}

function drawNodes(g){
 const positive=V.mul(g.n,MOON_ORBIT);
 const negative=V.mul(g.n,-MOON_ORBIT);
 line3(V.mul(g.n,-SUN_ORBIT),V.mul(g.n,SUN_ORBIT),"rgba(240,177,255,0.75)",1.5,[4,4]);
 marker(positive,"昇交点",g.n,"#f0b1ff");
 marker(negative,"降交点",V.mul(g.n,-1),"#f0b1ff");
}

function marker(pos,label,direction,color){
 const p=project(pos);
 ctx.save();
 ctx.fillStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=12;
 ctx.beginPath();
 ctx.arc(p.x,p.y,4,0,TAU);
 ctx.fill();
 ctx.restore();
 label3(V.add(pos,V.mul(direction,5)),label,color,-5);
}

function line3(a,b,color,width=1,dash=[]){
 const A=project(a),B=project(b);
 ctx.save();
 ctx.strokeStyle=color;
 ctx.lineWidth=width;
 ctx.setLineDash(dash);
 ctx.beginPath();
 ctx.moveTo(A.x,A.y);
 ctx.lineTo(B.x,B.y);
 ctx.stroke();
 ctx.restore();
}

function label3(pos,text,color,offsetY=-9){
 const p=project(pos);
 ctx.save();
 ctx.font="11px system-ui,sans-serif";
 ctx.textAlign="center";
 ctx.fillStyle=color;
 ctx.shadowColor="#080d19";
 ctx.shadowBlur=5;
 ctx.fillText(text,p.x,p.y+offsetY);
 ctx.restore();
}

function drawAngleGuide(g){
 const R=24;
 const a=V.mul(g.n,R);
 const b=V.add(
  V.mul(g.n,R*Math.cos(INC)),
  V.mul(g.q,R*Math.sin(INC))
 );

 line3([0,0,0],a,"rgba(84,230,211,0.8)",1.2,[3,4]);
 line3([0,0,0],b,"rgba(144,158,255,0.95)",1.5,[3,4]);

 const arc=[];
 for(let i=0;i<=24;i++){
  const ang=INC*i/24;
  arc.push(project(V.mul(
   V.add(V.mul(g.n,Math.cos(ang)),V.mul(g.q,Math.sin(ang))),
   R*0.7
  )));
 }

 ctx.save();
 ctx.strokeStyle="#ffe3a0";
 ctx.lineWidth=2;
 ctx.beginPath();
 arc.forEach((p,i)=>{
  if(i===0)ctx.moveTo(p.x,p.y);
  else ctx.lineTo(p.x,p.y);
 });
 ctx.stroke();

 const mid=project(V.mul(
  V.add(V.mul(g.n,Math.cos(INC/2)),V.mul(g.q,Math.sin(INC/2))),
  R*0.9
 ));
 ctx.font="bold 11px system-ui,sans-serif";
 ctx.fillStyle="#ffe3a0";
 ctx.fillText("5.1°",mid.x+8,mid.y-8);
 ctx.restore();
}

function drawLight(g){
 line3(g.sun,g.earth,"rgba(255,218,125,0.45)",1.5,[5,5]);
 if(g.eclipse){
  line3(g.moon,g.earth,"rgba(5,8,20,0.98)",15);
  line3(g.moon,g.earth,"rgba(255,204,98,0.98)",3);
  line3(g.moon,g.earth,"rgba(255,244,196,0.95)",1,[3,3]);
 }
}

function drawBody(body){
 const p=project(body.pos);
 const r=Math.max(2,body.size*p.scale);
 ctx.save();
 if(body.glow){
  ctx.shadowColor=body.glow;
  ctx.shadowBlur=body.name==="太陽"?23:13;
 }
 const grad=ctx.createRadialGradient(
  p.x-r*.35,p.y-r*.4,Math.max(.5,r*.05),
  p.x,p.y,r
 );
 grad.addColorStop(0,body.light);
 grad.addColorStop(.55,body.color);
 grad.addColorStop(1,body.dark);
 ctx.fillStyle=grad;
 ctx.beginPath();
 ctx.arc(p.x,p.y,r,0,TAU);
 ctx.fill();
 ctx.restore();
 label3(body.pos,body.name,"#eef3ff",r+13);
}

function render(){
 const rect=canvas.getBoundingClientRect();
 DPR=Math.min(window.devicePixelRatio||1,2);
 const w=Math.round(rect.width*DPR);
 const h=Math.round(rect.height*DPR);

 if(canvas.width!==w||canvas.height!==h){
  canvas.width=w;
  canvas.height=h;
 }
 W=rect.width;
 H=rect.height;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.clearRect(0,0,W,H);

 current=geometry(day);
 const g=current;

 drawPlane(g,"sun");
 drawPlane(g,"moon");
 drawEclipseWindows(g);
 drawNodes(g);
 drawAngleGuide(g);
 drawLight(g);

 const bodies=[
  {name:"太陽",pos:g.sun,size:SUN_SIZE,color:"#ffca5c",light:"#fff7cf",dark:"#a95520",glow:"#ffb83c"},
  {name:"地球",pos:g.earth,size:EARTH_SIZE,color:"#3984dd",light:"#a7dcff",dark:"#102c59",glow:"#347bff"},
  {name:"月",pos:g.moon,size:MOON_SIZE,color:"#c6d0e0",light:"#ffffff",dark:"#515f79",glow:g.eclipse?"#ffcf69":""}
 ];
 bodies.sort((a,b)=>camera(a.pos)[2]-camera(b.pos)[2]);
 for(const body of bodies)drawBody(body);

 dot.classList.toggle("on",g.eclipse);
 const seasonText=g.inEclipseSeason?"日食シーズン内":"日食シーズン外";
 const moonText=g.separation<ALIGN_LIMIT?"月と太陽：方向一致":"方向ずれ";
 status.textContent=g.eclipse
  ?"【日食条件達成】日食シーズン内で月が太陽・地球間にあります。"
  :seasonText+" ／ "+moonText;
}

// 自動再生ループ
function animate(timestamp){
 if(!isPlaying)return;
 if(lastTimestamp===null)lastTimestamp=timestamp;
 const elapsed=(timestamp-lastTimestamp)/1000; // 秒
 lastTimestamp=timestamp;

 const speed=Number(speedSelect.value);
 day+=elapsed*speed*2; // 速度調整
 if(day>Number(slider.max)){
  day=0; // ループ
 }
 slider.value=day;
 render();
 animationFrameId=requestAnimationFrame(animate);
}

function startPlay(){
 isPlaying=true;
 lastTimestamp=null;
 playBtn.textContent="⏸ 一時停止";
 playBtn.classList.add("active");
 animationFrameId=requestAnimationFrame(animate);
}

function stopPlay(){
 isPlaying=false;
 playBtn.textContent="▶ 自動再生";
 playBtn.classList.remove("active");
 cancelAnimationFrame(animationFrameId);
}

playBtn.addEventListener("click",()=>{
 if(isPlaying){
  stopPlay();
 }else{
  startPlay();
 }
});

speedSelect.addEventListener("change",()=>{
 // 速度変更時はタイムスタンプをリセットして急なジャンプを防ぐ
 lastTimestamp=null;
});

slider.addEventListener("input",()=>{
 if(isPlaying) stopPlay(); // スライダー操作時は自動停止
 day=Number(slider.value);
 render();
});

document.getElementById("reset").addEventListener("click",()=>{
 stopPlay();
 day=0;
 slider.value="0";
 yaw=-0.55;
 pitch=0.30;
 zoom=1;
 render();
});

// スマホ・PC両対応のタッチ・マウス操作（スライド回転 & ピンチズーム）
const activePointers = new Map();
let initialPinchDist = 0;
let initialZoom = 1;

canvas.addEventListener("pointerdown", e => {
 activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
 canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", e => {
 if(!activePointers.has(e.pointerId)) return;
 activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

 if(activePointers.size === 2) {
  // ピンチイン・アウト（2本指）
  const points = Array.from(activePointers.values());
  const dist = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
  if(initialPinchDist === 0) {
   initialPinchDist = dist;
   initialZoom = zoom;
  } else {
   zoom = Math.max(0.55, Math.min(2.6, initialZoom * (dist / initialPinchDist)));
   render();
  }
 } else if(activePointers.size === 1 && activePointers.has(e.pointerId)) {
  // 1本指スライドによる視点回転
  const prev = activePointers.get(e.pointerId);
  // ※簡易的に前回位置との差分を取るため、pointermove内で前回の値を更新または簡易計算
 }
});

// よりスムーズな1本指回転と2本指ピンチのためのイベント管理
let lastX = 0, lastY = 0, isDragging = false;

canvas.addEventListener("pointerdown", e => {
 if(activePointers.size === 1) {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
 }
});

canvas.addEventListener("pointermove", e => {
 if(activePointers.size === 1 && isDragging) {
  yaw += (e.clientX - lastX) * 0.008;
  pitch = Math.max(-1.48, Math.min(1.48, pitch + (e.clientY - lastY) * 0.008));
  lastX = e.clientX;
  lastY = e.clientY;
  render();
 }
});

function clearPointer(e) {
 activePointers.delete(e.pointerId);
 if(activePointers.size < 2) {
  initialPinchDist = 0;
 }
 if(activePointers.size === 0) {
  isDragging = false;
 }
}

canvas.addEventListener("pointerup", clearPointer);
canvas.addEventListener("pointercancel", clearPointer);

canvas.addEventListener("wheel", e => {
 e.preventDefault();
 zoom = Math.max(0.55, Math.min(2.6, zoom * Math.exp(-e.deltaY * 0.001)));
 render();
},{passive:false});

window.addEventListener("resize", render);
render();
})();
</script>
</body>
</html>
